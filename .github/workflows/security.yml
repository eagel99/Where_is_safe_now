name: Security Tests

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Syntax check plus the unit, correlation, ranking and security suites.
      - name: Run tests
        run: npm run verify

      # Requires package-lock.json — without it npm exits ENOLOCK and audits nothing.
      # No `|| true`: a high/critical advisory must fail the job, not go green.
      - name: Audit dependencies
        run: npm audit --audit-level=high
